hydra:
  job:
    chdir: false
  run:
    dir: ckpts/${model.name}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: Emilia_ZH_EN
  path: data/Emilia_ZH_EN_pinyin
  batch_size_per_gpu: 19200
  batch_size_type: frame
  max_samples: 64
  num_workers: 16

optim:
  epochs: 11
  learning_rate: 7.5e-5
  num_warmup_updates: 20000
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False
  mixed_precision: bf16

model:
  name: WaveGen_Emilia_24k_50Hz_SF_80bin_ibdim32_drop02
  tokenizer: pinyin
  tokenizer_path: ${datasets.path}/vocab.txt
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: logistic_normal
    P_mean: -0.8
    P_std: 0.8
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: True
    aux_mel_loss_weight: 0.05
    sf_loss_weight: 0.1
    mel_xt_drop_prob: 0.0
    inference_bottleneck_dropout: 0.2
    inference_bottleneck_dropout_seed: 0
    sample_rate: 24000
    joint_cond_drop_prob: 0.1
  arch:
    dim: 1152
    depth: 24 # 28 (24 backbones + 2 Wave Head + 2 Spectral Forcing Head)
    heads: 16 
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: True
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: False
    checkpoint_activations: False
    mel_channels: 80
    use_mel_information_bottleneck: True
    mel_bottleneck_dim: 32
    mel_bottleneck_dropout: 0.2
    mel_bottleneck_zero_init: False
    use_audio_proj: True
    audio_proj_dim: 1024
    audio_proj_hidden: 2048
  waveform:
    target_sample_rate: 24000
    wav_frame_len: 480

ckpts:
  logger: wandb
  log_samples: False
  save_per_updates: 50000
  keep_last_n_checkpoints: -1
  last_per_updates: 5000
  exp_name: ${model.name}_${model.tokenizer}_${datasets.name}
  save_dir: ckpts/${model.name}_${model.tokenizer}_${datasets.name}
