[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wavegen"
authors = [{name = "Sang-Hoon Lee"}]
version = "0.1.0"
description = "WaveGen: waveform speech generation"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>0.37.0; platform_machine!='arm64' and platform_system!='Darwin'",
    "cached_path",
    "click",
    "datasets",
    "einops>=0.8.2",
    "ema_pytorch>=0.5.2",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.26.0,<1.0",
    "librosa",
    "matplotlib",
    "numpy<2.0.0",
    "pydantic<=2.10.6",
    "pydub",
    "pypinyin",
    "rjieba",
    "safetensors",
    "soundfile>=0.13.1",
    "tomli",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec",
    "torchdiffeq",
    "tqdm",
    "transformers",
    "transformers-stream-generator",
    "unidecode",
    "wandb",
    "x-transformers>=1.31.14",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
eval = [
    "faster_whisper==0.10.1",
    "funasr",
    "jiwer==3.1.0",
    "modelscope",
    "zhconv",
    "zhon",
]

[project.urls]
WavTTS = "https://github.com/cwx-worst-one/WavTTS"
F5-TTS = "https://github.com/SWivid/F5-TTS"

[project.scripts]
"wavegen_v_spec_infer-cli" = "wavegen_v_spec.infer.infer_cli:main"
"wavegen_v_spec_train" = "wavegen_v_spec.train.train:main"
"wavegen_infer-cli" = "wavegen_v_spec.infer.infer_cli:main"
"wavegen_base_infer-cli" = "wavegen.infer.infer_cli:main"
"wavegen_flash_infer-cli" = "wavegen_flash.infer.infer_cli:main"

[tool.setuptools]
license-files = ["LICENSE", "docs/THIRD_PARTY_NOTICES.md", "docs/licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wavegen*"]

[tool.setuptools.package-data]
wavegen = [
    "configs/*.yaml",
    "infer/examples/*.toml",
    "infer/examples/*.wav",
    "infer/examples/*.txt",
    "infer/*.sh",
    "infer/*.md",
    "train/*.sh",
    "train/*.md",
    "eval/*.sh",
    "eval/*.md",
    "eval/*.toml",
]

wavegen_v_spec = [
    "README.md", "THIRD_PARTY_NOTICES.md",
    "configs/*.yaml", "infer/examples/*", "infer/*.sh", "infer/*.md",
    "train/*.md", "train/*.sh", "eval/*.sh", "eval/*.md", "eval/*.toml",
]

wavegen_flash = [
    "README.md", "configs/*.yaml", "infer/*.md", "eval/*.md",
]
