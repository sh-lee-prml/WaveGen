  arch:
    dim: 1152
    depth: 24
    heads: 16
    dropout: 0.0
    ff_mult: 4
    text_dim: 512
    text_mask_padding: true
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: false
    checkpoint_activations: false
    mel_channels: 80
    use_mel_information_bottleneck: true
    mel_bottleneck_dim: 32
    mel_bottleneck_dropout: 0.2
    mel_bottleneck_zero_init: false
    use_audio_proj: true
    audio_proj_dim: 1024
    audio_proj_hidden: 2048
  waveform:
    target_sample_rate: 24000
    wav_frame_len: 480
