model:
  name: WaveGen_Emilia_24k_50Hz_SF_80bin_ibdim32_drop02
  tokenizer: pinyin
  backbone: DiT
  cfm:
    prediction: x_pred
    loss_space: v
    t_sampling: logistic_normal
    P_mean: -0.8
    P_std: 0.8
    time_shift: 1.0
    t_eps: 0.02
    latents_scale: 9.0
    use_aux_mel_loss: false
    aux_mel_loss_weight: 0.0
    use_ms_v_spec_loss: true
    ms_v_spec_loss_weight: 0.1
    aux_mel_loss_masked: true
    sf_loss_weight: 0.1
    mel_xt_drop_prob: 0.0
    inference_bottleneck_dropout: 0.2
    inference_bottleneck_dropout_seed: 0
    sample_rate: 24000
